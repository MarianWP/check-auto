<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <!-- Масштабування сторінки дозволене; зум подвійним тапом вимикає touch-action у стилях. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Golf Check</title>
  <meta name="description" content="Чек-лист огляду Volkswagen Golf V перед покупкою: мотори, хвороби, ціни в Україні, покроковий огляд і звіт.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Golf Check">
  <meta name="theme-color" content="#101112">
  <style>html { background: #101112; }</style>
  <!-- Шрифт інтерфейсу: вантажимо одразу, щоб текст не перемальовувався після появи. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/assets/fonts/manrope-cyrillic-wght-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/assets/fonts/manrope-latin-wght-normal.woff2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
  <script>
    /* Telegram Mini App: SDK потрібен лише коли апку відкрито з Telegram (параметри запуску у hash
       або збережені SDK після перезавантаження). Поза Telegram зайвого запиту немає — PWA працює офлайн. */
    (function () {
      var launch = /tgWebApp(Data|Platform|Version|StartParam)=/.test(location.hash), stored = false;
      try { stored = !!sessionStorage.getItem("__telegram__initParams"); } catch (e) { /* немає доступу */ }
      if (!launch && !stored) return;
      document.documentElement.dataset.tg = "1";
      var s = document.createElement("script");
      s.src = "https://telegram.org/js/telegram-web-app.js";
      s.onload = function () { window.dispatchEvent(new Event("tg-sdk")); };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Для роботи Golf Check потрібен JavaScript.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
