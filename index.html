<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Golf Check</title>
  <meta name="description" content="Чек-лист огляду Volkswagen Golf V перед покупкою: мотори, хвороби, ціни в Україні, покроковий огляд і звіт.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Golf Check">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* Telegram Mini App: SDK потрібен лише коли апку відкрито з Telegram (параметри запуску у hash
       або збережені SDK після перезавантаження). Поза Telegram зайвого запиту немає — PWA працює офлайн. */
    (function () {
      var launch = /tgWebApp(Data|Platform|Version|StartParam)=/.test(location.hash), stored = false;
      try { stored = !!sessionStorage.getItem("__telegram__initParams"); } catch (e) { /* немає доступу */ }
      if (!launch && !stored) return;
      document.documentElement.dataset.tg = "1";
      var s = document.createElement("script");
      s.src = "https://telegram.org/js/telegram-web-app.js";
      s.onload = function () { window.dispatchEvent(new Event("tg-sdk")); };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Для роботи Golf Check потрібен JavaScript.</p></noscript>
  <!-- Vue 3 і vue-router 4 лежать локально (vendor/): без збірки, без CDN, працює офлайн. -->
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/vue-router.global.prod.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/checklist.js"></script>
  <script src="js/tg.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
